[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e needs a real WeChat window and a live 8768. It is collected by CI
# (an import break there is real) but never executed there.
norecursedirs = ["tests/e2e", ".venv", "third_party", "app", "*.egg-info"]
